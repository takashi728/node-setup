# =============================================================================
# Nginx reverse proxy for VPS1 — fronting XHTTP behind Nginx
#
# Why: Xray's XHTTP docs recommend hiding Xray behind Nginx/Caddy
#      to reduce fingerprinting. Nginx handles TLS termination and
#      proxies XHTTP traffic to Xray on localhost.
#
# This config assumes:
#   - TLS cert at /etc/ssl/private/fullchain.cer
#   - TLS key  at /etc/ssl/private/private.key
#   - Xray listening on localhost:8443 (XHTTP, no TLS)
#   - Nginx listening on 0.0.0.0:443 (TLS termination)
#
# IMPORTANT: If you use this, change VPS1's xray config:
#   - Xray inbound: listen 127.0.0.1, port 8443, security "none"
#   - Remove certificates from Xray's tlsSettings (Nginx does TLS)
#
# Alternative: Xray handles TLS directly (simpler, current config)
#   — use the existing vps1-edge-node.jsonc as-is without Nginx.
# =============================================================================

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- Logging ----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- Gzip ----
    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ---- Rate limiting for fallback connections ----
    limit_req_zone $binary_remote_addr zone=fallback:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    # ---- Upstream to Xray (localhost, no TLS) ----
    # grpc_pass is used for XHTTP stream-up mode (default on H2)
    # For packet-up only, use proxy_pass instead
    upstream xray_backend {
        server 127.0.0.1:8443;
        keepalive 32;
    }

    # ---- HTTPS server (XHTTP proxy) ----
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name <VPS1_DOMAIN>;

        # ---- TLS ----
        ssl_certificate     /etc/ssl/private/fullchain.cer;
        ssl_certificate_key /etc/ssl/private/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---- OCSP stapling ----
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ---- Security headers ----
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ---- XHTTP path → Xray backend ----
        #
        # IMPORTANT: Replace /yourSecretPath with your actual path.
        # The location path MUST exactly match xhttpSettings.path in the Xray config.
        #
        # grpc_pass: For stream-up mode (H2), nginx proxies gRPC correctly.
        # proxy_pass: For packet-up mode, use proxy_pass with buffering disabled.
        #
        # If you use stream-up mode (default on H2), use grpc_pass:
        location /<YOUR_SECRET_PATH> {
            if ($content_type !~ "application/grpc") {
                return 404;
            }
            grpc_pass grpc://xray_backend;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Fallback: return generic 404 or serve a decoy site ----
        location / {
            root /var/www/fallback;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # ---- Block common scan paths ----
        location ~ ^/(\.git|\.env|wp-admin|phpmyadmin|admin|config) {
            return 404;
        }
    }

    # ---- HTTP → HTTPS redirect ----
    server {
        listen 80;
        listen [::]:80;
        server_name <VPS1_DOMAIN>;

        # Allow ACME challenges for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
