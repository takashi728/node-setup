# =============================================================================
# Nginx decoy/fallback service for VPS1
#
# Two deployment modes:
#
# A) Nginx terminates TLS, front-ends Xray on localhost (no fallback needed).
#    Use:  ./install-vps.sh --role edge --domain <DOMAIN> --secret-key <KEY>
#    Then: docker compose -f docker-compose.nginx.yml up -d
#
# B) Xray handles TLS, VLESS fallbacks → Nginx decoy on localhost:8080.
#    Add to Xray inbound settings:
#      "fallbacks": [{ "dest": 8080 }]
#    Then deploy this Nginx config + decoy website via docker-compose.
#
# This config implements MODE B — Nginx runs behind Xray as a fallback decoy.
# Xray binds 443 (TLS), unrecognized connections hit Nginx on :8080.
# =============================================================================

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 8080;
        server_name _;

        # ---- Decoy: serve a real-looking website ----
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # ---- Block common scan paths ----
        location ~ ^/(\.git|\.env|wp-admin|phpmyadmin|admin|config) {
            return 404;
        }
    }
}
